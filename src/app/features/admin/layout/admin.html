<div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand-logo">
                HMS
            </div>

            <div class="brand-info">
                <h2>Hospital Portal</h2>
                <p>Administration</p>
            </div>

        </div>

        <nav class="sidebar-nav">

            <ul>

                <li>
                    <a routerLink="/admin" class="nav-item">
                        <span class="nav-icon">
                            ⌂
                        </span>

                        <span class="nav-label">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li>
                    <a routerLink="/admin/doctors" class="nav-item">
                        <span class="nav-icon">
                            ⚕
                        </span>

                        <span class="nav-label">
                            Doctors
                        </span>
                    </a>
                </li>

                <li>
                    <a routerLink="/admin/employees" class="nav-item">
                        <span class="nav-icon">
                            ◉
                        </span>

                        <span class="nav-label">
                            Employees
                        </span>
                    </a>
                </li>

                <!-- <li>
                    <a
                        routerLink="/admin/settings"
                        class="nav-item"
                    >
                        <span class="nav-icon">
                            ⚙
                        </span>

                        <span class="nav-label">
                            Settings
                        </span>
                    </a>
                </li> -->

            </ul>

        </nav>

        <div class="sidebar-footer">

            <button (click)="onLogout()" class="logout-button">
                <span class="nav-icon">
                    ↗
                </span>

                <span>
                    Logout
                </span>
            </button>

        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-left">

                <h1>
                    My Hospital
                </h1>

                <p>
                    Internal Operations Portal
                </p>

            </div>

            <div class="topbar-right">

                <div class="user-profile">

                    <div class="user-avatar">
                        A
                    </div>

                    <div class="user-info">
                        <h4>Administrator</h4>
                        <p>System Access</p>
                    </div>

                </div>

            </div>

        </header>

        <!-- ROUTED CONTENT -->
        <section class="page-content">

            <router-outlet></router-outlet>

        </section>

    </main>
