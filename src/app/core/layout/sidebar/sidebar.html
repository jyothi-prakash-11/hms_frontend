<nav class="sidebar-nav">

    <ul class="nav-list">

        @for (nav of navItems(); track nav.route) {

        <li class="nav-item">

            <a [routerLink]="[baseRoute, nav.route]" routerLinkActive="active" [routerLinkActiveOptions]="{
                    exact: nav.route === '' || nav.route === '/'
                }">

                {{ nav.label }}

            </a>

        </li>

        }

    </ul>

</nav>
