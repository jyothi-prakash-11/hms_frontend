<div class="sidebar-nav">
    <ul>
        @for (nav of navItems(); track nav.route) {
        <li>
            <a [routerLink]="[baseRoute, nav.route]" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: nav.route === '' || nav.route === '/' }">
                <span class="nav-label">{{ nav.label }}</span>
            </a>
        </li>
        }
    </ul>
</div>
